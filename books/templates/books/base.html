
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Каталог книг</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        nav a {
            margin-right: 20px;
        }

        .message {
            padding: 10px;
            margin: 15px 0;
            background: #eeeeee;
        }

        .success {
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
        }

        input, select {
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Каталог книг</h1>

    <nav>
        <a href="{% url 'book_list' %}">Все книги</a>
        <a href="{% url 'add_book' %}">Добавить книгу</a>
        <a href="{% url 'upload_book' %}">Загрузить файл</a>
    </nav>

    <hr>

    {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
